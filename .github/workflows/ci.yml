name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  boundary-tests:
    name: Boundary tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax-check org-mcp.py
        run: python -m py_compile org-mcp.py
      - name: Run pure-Python boundary tests
        run: python tests/test_boundary.py
